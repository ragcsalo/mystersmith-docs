site_name: Guides & Documentations
site_url: https://mystersmith.info/
site_description: Guides and documentation for the MysterSmith app - features, add-ons, subscriptions, tutorials and demo videos.
copyright: Copyright &copy; 2025-2026 Benke Smith - All rights reserved.
theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - content.code.copy
    - navigation.top
  palette:
    scheme: default
    primary: custom
    accent: custom
  logo: assets/images/MysterSmith_logo.png
  favicon: assets/images/ico.png
extra_css:
- stylesheets/extra.css
extra_javascript:
- javascripts/ms-version-nav.js
markdown_extensions:
- attr_list
- md_in_html
- toc
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.tasklist:
    custom_checkbox: true
plugins:
- search
# the old address of a moved page keeps working (an invisible redirect page is generated there)
- redirects:
    redirect_maps:
      user-guide/download-the-app.md: about-mystersmith/download-the-app.md
      about-mystersmith/peeksmith-addons-migration.md: purchase-add-ons/peeksmith-addons-migration.md
- glightbox:
    touchNavigation: true
    loop: true
    effect: zoom
    manual: true
validation:
  nav:
    omitted_files: ignore
nav:
- Home: index.md
