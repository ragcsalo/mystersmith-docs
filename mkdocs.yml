site_name: Guides & Documentations
copyright: Copyright &copy; 2025-2026 Benke Smith - All rights reserved.
theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - content.code.copy
    - navigation.top
  palette:
    scheme: default
    primary: custom
    accent: custom
  logo: assets/images/MysterSmith_logo.png
  favicon: assets/images/ico.png
extra_css:
- stylesheets/extra.css
extra_javascript:
- javascripts/ms-version-nav.js
markdown_extensions:
- attr_list
- md_in_html
- toc
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.tasklist:
    custom_checkbox: true
plugins:
- search
- glightbox:
    touchNavigation: true
    loop: true
    effect: zoom
    manual: true
validation:
  nav:
    omitted_files: ignore
nav:
